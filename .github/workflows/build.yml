name: build

on:
    workflow_dispatch:
        inputs:
            mode:
                description: build mode
                required: true
                default: default
                type: choice
                options:
                    - default
                    - release
            version:
                description: release version (fallbacks to ez version)
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    SCCACHE_GHA_ENABLED: "true"

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.value }}

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: resolve release version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  version="${INPUT_VERSION:-$(python3 ./ez release-version)}"
                  echo "value=$version" >> "$GITHUB_OUTPUT"

    build-appimage:
        needs: prepare
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential cmake ninja-build clang-20 pkg-config \
                      libmpv-dev libwebkit2gtk-4.1-dev libsqlite3-dev \
                      libssl-dev libcurl4-openssl-dev libgl1-mesa-dev \
                      libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
                      libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdecor-0-dev libxtst-dev \
                      libfreetype-dev libfontconfig1-dev \
                      curl desktop-file-utils

            - name: package appimage
              run: python3 ./ez package --type appimage
              env:
                  APPIMAGE_EXTRACT_AND_RUN: "1"
                  CC: clang-20
                  CXX: clang++-20

            - name: upload appimage artifact
              uses: actions/upload-artifact@v7
              with:
                  name: appimage-bundle
                  path: dist/musiq-*.AppImage
                  if-no-files-found: error

            - name: sccache stats
              if: always()
              run: sccache --show-stats

    release:
        if: ${{ always() && inputs.mode == 'release' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        needs: [prepare, build-appimage]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: download artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: "*-bundle"
                  path: artifacts
                  merge-multiple: true

            - name: get changelog
              run: python3 ./ez parse-note --version "${{ needs.prepare.outputs.version }}" --dest release-notes.md

            - name: create or update release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.prepare.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: musiq ${{ needs.prepare.outputs.version }}
                  body_path: release-notes.md
                  files: artifacts/*
                  fail_on_unmatched_files: true
