name: build

on:
    workflow_dispatch:
        inputs:
            mode:
                description: build mode
                required: true
                default: default
                type: choice
                options:
                    - default
                    - release
            version:
                description: release version (fallbacks to ez version)
                required: false
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

env:
    SCCACHE_GHA_ENABLED: "true"

jobs:
    prepare:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.value }}

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: resolve release version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  version="${INPUT_VERSION:-$(python3 ./ez release-version)}"
                  echo "value=$version" >> "$GITHUB_OUTPUT"

    build-appimage:
        needs: prepare
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      build-essential cmake ninja-build clang-20 pkg-config \
                      libmpv-dev libwebkit2gtk-4.1-dev libsqlite3-dev \
                      libssl-dev libcurl4-openssl-dev libgl1-mesa-dev \
                      libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
                      libwayland-dev libxkbcommon-dev libegl1-mesa-dev libdecor-0-dev libxtst-dev \
                      libfreetype-dev libfontconfig1-dev \
                      curl desktop-file-utils

            - name: package appimage
              run: python3 ./ez package --type appimage
              env:
                  APPIMAGE_EXTRACT_AND_RUN: "1"
                  CC: clang-20
                  CXX: clang++-20

            - name: upload appimage artifact
              uses: actions/upload-artifact@v7
              with:
                  name: appimage-bundle
                  path: dist/musiq-*.AppImage
                  if-no-files-found: error

            - name: sccache stats
              if: always()
              run: sccache --show-stats

    build-arch:
        needs: prepare
        runs-on: ubuntu-latest
        container: archlinux:base-devel

        steps:
            - name: install system dependencies
              run: |
                  pacman -Syu --noconfirm --needed \
                      git python cmake ninja clang lld pkgconf boost nlohmann-json miniz \
                      mpv webkit2gtk-4.1 sqlite openssl curl mesa sdl3 freetype2 fontconfig libdecor

            - name: install nfpm
              run: |
                  curl -fL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz \
                      -o /tmp/nfpm.tar.gz
                  tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm

            - name: checkout
              uses: actions/checkout@v7

            - name: setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: package arch
              run: python3 ./ez package --type arch

            - name: upload arch artifact
              uses: actions/upload-artifact@v7
              with:
                  name: arch-bundle
                  path: dist/musiq-*.pkg.tar.zst
                  if-no-files-found: error

            - name: sccache stats
              if: always()
              run: sccache --show-stats

    build-windows:
        needs: prepare
        runs-on: windows-latest

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: setup MSVC environment
              uses: ilammy/msvc-dev-cmd@v1

            - name: setup sccache
              uses: mozilla-actions/sccache-action@v0.0.10

            - name: install packaging and build tools
              shell: pwsh
              run: |
                  choco install innosetup --no-progress -y
                  "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

            - name: package installer and zip
              run: python ./ez package
              env:
                  CC: clang-cl
                  CXX: clang-cl

            - name: upload windows packages
              uses: actions/upload-artifact@v7
              with:
                  name: windows-bundle
                  path: |
                      dist/musiq-*.exe
                      dist/musiq-*.zip
                  if-no-files-found: error

            - name: sccache stats
              if: always()
              run: sccache --show-stats

    release:
        if: ${{ always() && inputs.mode == 'release' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        needs: [prepare, build-appimage, build-arch, build-windows]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: checkout
              uses: actions/checkout@v7

            - name: download artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: "*-bundle"
                  path: artifacts
                  merge-multiple: true

            - name: get changelog
              run: python3 ./ez parse-note --version "${{ needs.prepare.outputs.version }}" --dest release-notes.md

            - name: create or update release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ needs.prepare.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: ${{ needs.prepare.outputs.version }}
                  body_path: release-notes.md
                  files: artifacts/*
                  fail_on_unmatched_files: true
