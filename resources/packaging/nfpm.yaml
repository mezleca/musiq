name: musiq
arch: ${MUSIQ_ARCH}
version: ${MUSIQ_VERSION}
release: 1
maintainer: mezleca
description: YouTube Music client
homepage: https://github.com/mezleca/musiq
license: MIT

archlinux:
  packager: mezleca

depends:
  - glibc
  - gcc-libs
  - boost-libs
  - miniz
  - sdl3
  - curl
  - openssl
  - sqlite
  - freetype2
  - fontconfig
  - libglvnd
  - gtk3
  - webkit2gtk-4.1
  - mpv

contents:
  - src: dist/arch/usr/
    dst: /usr
